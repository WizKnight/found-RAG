services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hybrid-rag-qdrant
    restart: always
    ports:
      - "6333:6333"   # REST API & Web Dashboard
      - "6334:6334"   # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=true