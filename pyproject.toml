[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "evidence-grounded-hybrid-rag"
version = "0.1.0"
description = "Evidence grounded hybrid RAG with citation verification."
requires-python = ">=3.11,<3.12"


[tool.setuptools.packages.find]
include = ["app*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]